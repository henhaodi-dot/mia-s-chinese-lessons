<!-- 汉字花园 (Hanzi Garden) — main app shell. -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>汉字花园</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/icons/icon-192.png">
<meta name="theme-color" content="#4caf50">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- Garden screen: this is the home screen. Radically simplified in v3 —
       just the garden background, the streak calendar, and the room doors
       (说说话 speaking room, 认认字 character room, 故事 story mode).
       Everything else that used to live in the header (cards, studio, the
       daily-session button) has moved inside those rooms. Only a tiny corner
       dot is left for the parent. -->
  <section id="screen-garden" class="screen" aria-label="花园">
    <header class="garden-header garden-header-v3">
      <div id="panda-corner" class="panda-corner" aria-hidden="true">
        <span id="panda-face" class="panda-face">🐼</span>
      </div>
      <button id="btn-parent" class="parent-dot" aria-label="家长区" title="家长区"></button>
    </header>

    <div id="streak-calendar" class="streak-calendar" aria-label="连续记录日历"></div>

    <div id="garden-grid" class="garden-grid" aria-label="我的花园"></div>

    <!-- The three doors. 说说话 and 认认字 are the daily practice rooms;
         故事 is the illustrated story mode. -->
    <div class="room-doors">
      <button id="btn-speaking" class="room-door room-door-speak" type="button">
        <span class="room-door-icon">🗣️</span>
        <span class="room-door-label">说说话</span>
      </button>
      <button id="btn-character" class="room-door room-door-character" type="button">
        <span class="room-door-icon">✏️</span>
        <span class="room-door-label">认认字</span>
        <span id="character-thirsty-badge" class="room-door-badge hidden" aria-label="需要复习的字"></span>
      </button>
      <button id="btn-story" class="room-door room-door-story" type="button">
        <span class="room-door-icon">📖</span>
        <span class="room-door-label">故事</span>
      </button>
    </div>
  </section>

  <!-- Card detail popup: shown when tapping a plant in the garden. -->
  <div id="card-modal" class="card-modal-overlay hidden">
    <div class="card-modal">
      <button id="btn-card-modal-close" class="icon-button" aria-label="关闭" type="button">✖️</button>
      <div id="card-modal-content"></div>
    </div>
  </div>

  <!-- Every room below carries a persistent 🏠 button (outside the room's
       content container, so it survives each activity re-rendering). It does
       exactly what the tablet's back button does — see app.js. Before this,
       the only way out mid-activity was the OS back button, which a
       standalone install on some devices doesn't have. -->

  <!-- Garden tap-to-review overlay (v2.3): tapping any plant opens this —
       flash the character, write it from memory, see the outcome. -->
  <section id="screen-garden-review" class="screen screen-overlay hidden" aria-label="复习">
    <button type="button" class="room-exit" data-exit="history" aria-label="回到花园" title="回到花园">🏠</button>
    <div id="garden-review-content" class="session-content"></div>
  </section>

  <!-- Practice studio overlay (写字时间, v2.3): zero-stakes 看/描/写 practice,
       separate from the garden's memory-recall review. -->
  <section id="screen-studio" class="screen screen-overlay hidden" aria-label="写字时间">
    <button type="button" class="room-exit" data-exit="studio" aria-label="返回" title="返回">⬅️</button>
    <div id="studio-content" class="session-content"></div>
  </section>

  <!-- 说说话 (speaking room, v3): the record-and-replay speaking activities.
       The panda models, she echoes, hears herself back. -->
  <section id="screen-speaking" class="screen screen-overlay hidden" aria-label="说说话">
    <button type="button" class="room-exit" data-exit="history" aria-label="回到花园" title="回到花园">🏠</button>
    <div id="speaking-content" class="session-content"></div>
  </section>

  <!-- 认认字 (character room, v3): learn today's new character (if any),
       then a session of longer games for review. -->
  <section id="screen-character" class="screen screen-overlay hidden" aria-label="认认字">
    <button type="button" class="room-exit" data-exit="history" aria-label="回到花园" title="回到花园">🏠</button>
    <div id="character-content" class="session-content"></div>
  </section>

  <!-- 故事 (story mode): illustrated stories with interactive layers. -->
  <section id="screen-story" class="screen screen-overlay hidden" aria-label="故事">
    <button type="button" class="room-exit" data-exit="history" aria-label="回到花园" title="回到花园">🏠</button>
    <div id="story-content" class="session-content"></div>
  </section>

  <!-- Parent Corner (家长区) — gated by a math question so she can't wander in. -->
  <section id="screen-parent" class="screen hidden" aria-label="家长区">
    <header class="simple-header">
      <button id="btn-parent-back" class="icon-button" aria-label="返回">⬅️</button>
      <span class="header-title">家长区</span>
    </header>

    <div id="parent-gate" class="parent-gate">
      <p>先回答一个小问题，确认是家长在操作：</p>
      <p id="parent-gate-question" class="parent-gate-question"></p>
      <input id="parent-gate-input" type="number" inputmode="numeric" class="parent-gate-input" placeholder="答案" />
      <button id="parent-gate-submit" class="big-button" type="button">确认</button>
      <p id="parent-gate-feedback" class="parent-gate-feedback"></p>
    </div>

    <div id="parent-content" class="parent-content hidden"></div>
  </section>

  <!-- Vendored locally so stroke animation/tracing works fully offline. -->
  <script src="vendor/hanzi-writer.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
